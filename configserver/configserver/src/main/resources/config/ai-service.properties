spring.config.import=optional:configserver:https://fitness-config-server-oj1p.onrender.com

spring.mongodb.uri=${AI_MONGODB_URI}

server.port=8083

eureka.client.service-url.defaultZone=https://fitness-eureka-oslx.onrender.com/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.kafka.bootstrap-servers=fitness-kafka-fitness-microservices.j.aivencloud.com:17112
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";

spring.kafka.consumer.group-id=activity-consumer-group
kafka.topic.name=activity-topic

gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
gemini.api.key=${GEMINI_API_KEY}

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.fitnessMicroserviceApplication.aiservice.model.Activity
spring.kafka.consumer.properties.spring.json.trusted.packages=*