spring.mongodb.uri=mongodb://localhost:27017/aiservice
server.port=8083
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.kafka.consumer.group-id=activity-consumer-group
kafka.topic.name=activity-topic
spring.kafka.bootstrap-servers=localhost:9092
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
gemini.api.key=${GEMINI_API_KEY}
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.fitnessMicroserviceApplication.aiservice.model.Activity
spring.kafka.consumer.properties.spring.json.trusted.packages=*