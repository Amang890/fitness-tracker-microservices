server.port=8085

eureka.client.service-url.defaultZone=https://fitness-eureka-oslx.onrender.com/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/**

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://fitness-keycloak-0zpe.onrender.com/realms/fitness-application/protocol/openid-connect/certs

spring.cloud.gateway.server.webflux.routes[1].id=activity-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ACTIVITY-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/activities/**

spring.cloud.gateway.server.webflux.routes[2].id=ai-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AI-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/recommendations/**

management.endpoints.web.exposure.include=gateway

# CORS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=https://fitness-frontend-n16o.onrender.com
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,X-User-ID
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=false
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true